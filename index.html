<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Soon - Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <h1>The Bless Update</h1>
        <div class="timebox">
            <div class="time">
                <h2 id="Days">00</h2>
                <p>Days</p>
            </div>

             <div class="time">
                <h2 id="Hours">00</h2>
                <p>Hours</p>
            </div>

             <div class="time">
                <h2 id="Minutes">00</h2>
                <p>Minutes</p>
            </div>

             <div class="time">
                <h2 id="Seconds">00</h2>
                <p>Seconds</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
